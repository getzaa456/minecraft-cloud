name: Release and Deploy

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.service }} image
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/minecraft-cloud-backend
          - service: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository_owner }}/minecraft-cloud-frontend

    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=sha-${{ steps.source.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production
    needs: publish
    runs-on: [self-hosted, linux, x64]
    environment: production

    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Free disk space
        shell: bash
        run: |
          echo "Disk usage before cleanup:"
          df -h /

          docker container prune -f || true
          docker image prune -af --filter "until=168h" || true
          docker builder prune -af --filter "until=168h" || true
          docker network prune -f || true

          echo "Disk usage after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create deployment environment
        shell: bash
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          test -n "$POSTGRES_PASSWORD"
          test -n "$GRAFANA_ADMIN_PASSWORD"
          cp .env.example .env
          sed -i "s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=${POSTGRES_PASSWORD}|" .env
          sed -i "s|^GRAFANA_ADMIN_PASSWORD=.*|GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}|" .env
          sed -i "s|^CORS_ORIGIN=.*|CORS_ORIGIN=${CORS_ORIGIN:-http://localhost}|" .env
          echo "BACKEND_IMAGE=ghcr.io/${{ github.repository_owner }}/minecraft-cloud-backend:sha-${{ steps.source.outputs.sha }}" >> .env
          echo "FRONTEND_IMAGE=ghcr.io/${{ github.repository_owner }}/minecraft-cloud-frontend:sha-${{ steps.source.outputs.sha }}" >> .env

      - name: Pull runtime dependencies with retry
        shell: bash
        run: |
          pull_with_retry() {
            image="$1"
            for attempt in 1 2 3 4 5; do
              if docker pull "$image"; then
                return 0
              fi
              echo "Pull failed for $image (attempt $attempt/5). Retrying..."
              sleep $((attempt * 10))
            done
            echo "Failed to pull $image after 5 attempts."
            return 1
          }

          pull_with_retry caddy:2-alpine
          pull_with_retry postgres:17-alpine
          pull_with_retry tecnativa/docker-socket-proxy:latest
          pull_with_retry quay.io/prometheus/prometheus:v3.14.0
          pull_with_retry grafana/grafana:13.2.2
          pull_with_retry quay.io/prometheus/node-exporter:v1.12.1
          pull_with_retry ghcr.io/google/cadvisor:v0.60.6

      - name: Pull application images from GHCR
        run: docker compose pull backend frontend

      - name: Deploy platform
        run: docker compose up -d --no-build --pull never --remove-orphans

      - name: Show deployment status
        run: docker compose ps
