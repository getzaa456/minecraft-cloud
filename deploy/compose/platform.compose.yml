name: minecraft-cloud

services:
  caddy:
    image: caddy:2-alpine
    container_name: minecraft-cloud-caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - edge
      - app

  frontend:
    build:
      context: ../../frontend
    container_name: minecraft-cloud-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - app

  backend:
    build:
      context: ../../backend
    container_name: minecraft-cloud-backend
    restart: unless-stopped
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      DATABASE_URL: postgresql://${POSTGRES_USER:-minecraft_cloud}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-minecraft_cloud}
      DOCKER_HOST: http://docker-socket-proxy:2375
      MINECRAFT_IMAGE: ${MINECRAFT_IMAGE:-itzg/minecraft-server:stable}
      MINECRAFT_PORT_RANGE_START: ${MINECRAFT_PORT_RANGE_START:-25565}
      MINECRAFT_PORT_RANGE_END: ${MINECRAFT_PORT_RANGE_END:-25665}
      MINECRAFT_DEFAULT_MEMORY_MB: ${MINECRAFT_DEFAULT_MEMORY_MB:-1024}
      MINECRAFT_DEFAULT_CPU: ${MINECRAFT_DEFAULT_CPU:-1}
      MINECRAFT_MAX_MEMORY_MB: ${MINECRAFT_MAX_MEMORY_MB:-4096}
      MINECRAFT_MAX_CPU: ${MINECRAFT_MAX_CPU:-2}
      MINECRAFT_DEFAULT_MAX_PLAYERS: ${MINECRAFT_DEFAULT_MAX_PLAYERS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - app
      - docker_api

  postgres:
    image: postgres:17-alpine
    container_name: minecraft-cloud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-minecraft_cloud}
      POSTGRES_USER: ${POSTGRES_USER:-minecraft_cloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-minecraft_cloud} -d ${POSTGRES_DB:-minecraft_cloud}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: minecraft-cloud-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      VOLUMES: 1
      POST: 1
      PING: 1
      VERSION: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_api

networks:
  edge:
  app:
    internal: true
  docker_api:
    internal: true

volumes:
  postgres_data:
    name: minecraft-cloud-postgres-data
  caddy_data:
    name: minecraft-cloud-caddy-data
  caddy_config:
    name: minecraft-cloud-caddy-config
